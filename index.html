<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>8a Solutions</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 0 16px;
    }
    h1 {
      font-size: clamp(2.75rem, 11vw, 9rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      margin: 0 0 0.08em;
      color: #fff;
      /* Reveal once on load, together with the tagline */
      animation:
        reveal 1.4s cubic-bezier(0.2, 0.7, 0.2, 1) both,
        tighten 1.4s cubic-bezier(0.2, 0.7, 0.2, 1) both;
    }
    @keyframes reveal {
      from {
        opacity: 0;
        filter: blur(12px);
      }
      to {
        opacity: 1;
        filter: blur(0);
      }
    }
    @keyframes tighten {
      from { letter-spacing: 0.04em; }
      to   { letter-spacing: -0.03em; }
    }
    .tagline {
      margin: 0 0 2.5em;
      font-size: clamp(1.125rem, 2.5vw, 1.75rem);
      color: rgba(255, 255, 255, 0.7);
      animation: reveal 1.4s cubic-bezier(0.2, 0.7, 0.2, 1) both;
    }
    .buttons {
      animation: fade-up 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) 0.8s both;
    }
    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      h1, .tagline, .buttons { animation: none; }
    }
    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
    }
    .button {
      display: inline-block;
      padding: 0.75em 1.5em;
      border: 2px solid #fff;
      border-radius: 999px;
      color: #fff;
      font-size: clamp(1.125rem, 2.5vw, 1.5rem);
      text-decoration: none;
      transition: background-color 0.2s, color 0.2s;
    }
    .button:hover,
    .button:focus-visible {
      background: #fff;
      color: #000;
    }
  </style>
</head>
<body>
  <h1>8a Solutions</h1>
  <p class="tagline">IT consulting</p>
  <div class="buttons">
    <a class="button" href="mailto:robert@8asolutions.se">robert@8asolutions.se</a>
    <a class="button" href="https://www.linkedin.com/in/robertkallgren" target="_blank" rel="noopener">LinkedIn</a>
  </div>
</body>
</html>
